name: V3 physics CPU boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  physics-software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU software test dependencies only
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          python -m pip install numpy==2.3.5 pymunk==7.2.0 pytest==9.1.1
      - name: Physics simulator, leakage, provenance and fail-closed tests
        run: PYTHONPATH=src python -m pytest tests_physics_v3 -q
      - name: CI cannot certify native MPS computation
        run: echo 'Neural world-model tests require actual native Apple MPS; no CPU substitution.'
