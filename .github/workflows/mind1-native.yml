name: Mind 1 native nontraining qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/mindscape/mind1/**'
      - 'src/mindscape/r56/**'
      - 'mind1_web/**'
      - 'tests_native/**'
      - 'tests_mind1/**'
      - '.github/workflows/mind1-native.yml'
permissions:
  contents: read
jobs:
  native-engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU framework; no pretrained model assets
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          python -m pip install -r requirements-mind1.txt pymunk==7.2.0
      - name: Native forward and backward diagnostics; no optimizer or training campaign
        run: |
          mkdir -p work/native-ci
          python -m pytest tests_native tests_mind1 tests_r56 -q -o junit_family=legacy --junitxml=work/native-ci/tests.xml
      - name: Independent frozen-source and tag preservation
        run: python scripts/native/ci_preservation.py --output work/native-ci/preservation.json
      - name: Browser source syntax
        run: |
          node --check mind1_web/app.js
          node --check mind1_web/math.js
          node --check mind1_web/science.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-engineering-${{ github.sha }}
          path: work/native-ci
