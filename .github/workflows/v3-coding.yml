name: V3 coding research controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  coding-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU sandbox and evaluator dependencies (no LM downloads)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          python -m pip install numpy==2.3.5 wasmtime==49.0.0
      - name: Restore and compile an isolated copy of preserved runtime
        run: |
          python scripts/research_v2/restore_cpu_baseline.py --archive research_checkpoint/research_release_2026-10-09 --destination work/coding-evidence
          mkdir -p work/coding
          cp -R work/coding-evidence/work/coding/runtime work/coding/runtime
      - name: Security, leakage, actual WASI and neural-gradient controls
        run: PYTHONPATH=src python -m unittest discover -s tests_coding_v3 -v
      - name: Train small proposal evaluators using approved training evidence only
        run: PYTHONPATH=src python -m mindscape.v3.coding_learning.train --manifest configs/v3_coding/benchmark_v1 --output work/coding-ci-training --runtime work/coding/runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v3-coding-controls-${{ github.sha }}
          path: work/coding-ci-training
