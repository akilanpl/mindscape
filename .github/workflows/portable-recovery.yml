name: Portable preservation recovery
on:
  push:
    branches: [preservation/portable-recovery-20261024]
permissions:
  contents: read
jobs:
  clean-linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install minimal CPU development environment from remote packages
        run: python scripts/bootstrap_portable.py
      - name: Run CPU development tests and independently verified episodes
        run: |
          .venv-portable/bin/python -m pytest -q tests/test_foundation.py tests/test_benchmark.py tests/test_learning.py
          .venv-portable/bin/python scripts/verify_portable.py
          .venv-portable/bin/python scripts/dataset.py validate datasets/generated/development_v1
          .venv-portable/bin/python scripts/evaluate.py --dataset datasets/generated/development_v1 --split test --training-size 1000
      - name: Verify remote Git archive parts and every research file
        run: .venv-portable/bin/python scripts/verify_research_archives.py research_checkpoint/*
