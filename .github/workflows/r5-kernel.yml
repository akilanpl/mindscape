name: R5 unified kernel software
on:
  push:
    paths: ['src/mindscape/r5_kernel/**', 'configs/r5_kernel/**', 'tests/r5_kernel/**', '.github/workflows/r5-kernel.yml']
  pull_request:
    paths: ['src/mindscape/r5_kernel/**', 'configs/r5_kernel/**', 'tests/r5_kernel/**', '.github/workflows/r5-kernel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: CPU tool dependencies only
        run: python -m pip install numpy==2.3.5 sympy==1.14.0 pymunk==7.2.0
      - name: Contract, symbolic, simulator and privacy tests; no training
        run: PYTHONPATH=src python -m unittest discover -s tests/r5_kernel -v
      - name: Native coverage boundary
        run: echo 'Local WASI and checkpoint tests skip when assets are absent. Native MPS/Qwen/shared-gradient smoke requires the Apple machine; CI does not certify it.'
