name: V3 mathematical learning controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mathematical-learning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU validation runtime (no pretrained weights)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          python -m pip install numpy==2.3.5 cryptography==50.0.2
      - name: Unit, teacher-boundary, optimizer-resume and control tests
        run: PYTHONPATH=src python -m unittest discover -s tests_math_v3 -v
      - name: Small frozen CPU replication and safe resume
        run: |
          PYTHONPATH=src python -m mindscape.v3.math_learning.experiment --manifest configs/v3_math --output work/math-ci --budgets 10 --seeds 0 --updates 20 --modes procedural concepts no_memory no_planning answer_only
          PYTHONPATH=src python -m mindscape.v3.math_learning.experiment --manifest configs/v3_math --output work/math-ci --budgets 10 --seeds 0 --updates 20 --modes procedural concepts no_memory no_planning answer_only
          PYTHONPATH=src python -m mindscape.v3.math_learning.verify --run work/math-ci --output work/math-ci-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v3-math-controls-${{ github.sha }}
          path: |
            work/math-ci
            work/math-ci-verification.json
