name: Isolated R56 remediation nontraining
on:
  push:
    branches: ['ci/r56-remediation-nontraining']
permissions:
  contents: read
jobs:
  nontraining-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout exact reviewed source, not workflow branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1e021994a51e9ba0abb008acb759678e19a2d87b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: CPU dependencies only; no pretrained assets
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          python -m pip install -r requirements-mind1.txt pymunk==7.2.0
      - name: Fail on optimizer construction; explicit nontraining suites only
        run: |
          mkdir -p work/remediation-ci
          python scripts/native/nontraining_ci.py -o junit_family=legacy --junitxml=work/remediation-ci/tests.xml
          python scripts/native/ci_preservation.py --output work/remediation-ci/preservation.json
          python scripts/native/remediation_receipts.py --output work/remediation-ci/diagnostics
          python -m pip freeze > work/remediation-ci/runtime.txt
      - name: Synthetic trainer/evaluator namespace probe only; no fitting
        run: |
          python - <<'PYPROBE'
          import json, hashlib, secrets
          from pathlib import Path
          from mindscape.r56.curriculum import digest
          from mindscape.r56.isolation import stage_training, run_isolation_pair, sha
          root=Path('work/remediation-ci/boundary');root.mkdir()
          package=root/'package';package.mkdir()
          raw=json.dumps([{'split':'train','observation':i} for i in range(512)]).encode()
          (package/'train.json').write_bytes(raw)
          manifest={'index':{'17':{'training_file':'train.json','sha256':hashlib.sha256(raw).hexdigest()}},'kind':'synthetic-boundary-canary; no campaign'}
          manifest['package_sha256']=digest(manifest)
          (package/'manifest.json').write_text(json.dumps(manifest))
          stage=root/'trainer';stage_training(package,stage,17,manifest['package_sha256'])
          vault=root/'vault';vault.mkdir();checkpoints=root/'checkpoint-vault';checkpoints.mkdir()
          (vault/'targets.json').write_text(secrets.token_hex(32))
          (checkpoints/'checkpoint.json').write_text(secrets.token_hex(32))
          for file in (vault/'targets.json',checkpoints/'checkpoint.json'):file.chmod(0o444)
          probe=Path('deploy/r56-isolation/probe.py')
          receipt=run_isolation_pair('python@sha256:2b4f19dae3a777dfc3b76730bda1e82e1f66ab2a2686fa93ca78edbfb4f04ffe',stage,probe,vault,checkpoints,sha(vault/'targets.json'),sha(checkpoints/'checkpoint.json'),sha(probe))
          receipt['source_sha']='1e021994a51e9ba0abb008acb759678e19a2d87b'
          receipt['scope']='Synthetic canary and checkpoint readability only; not a real model/evaluator qualification'
          Path('work/remediation-ci/boundary-receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          assert receipt['boundary_probe_passed'] is True
          assert receipt['qualified'] is False
          PYPROBE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-r56-remediation-receipts
          path: |
            work/remediation-ci/tests.xml
            work/remediation-ci/preservation.json
            work/remediation-ci/runtime.txt
            work/remediation-ci/diagnostics
            work/remediation-ci/boundary-receipt.json
